name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - copilot/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Ruff
        run: python -m ruff check src exercises tests

      - name: Compile check
        run: python -m compileall -q src exercises tests

      - name: Pytest
        run: python -m pytest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "README.md" "docs/**/*.md" "notes/**/*.md" ".github/**/*.md" "journal/**/*.md"
